name: Testes

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    name: Testes e validação
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: pinda_test
          POSTGRES_PASSWORD: ci-only-not-a-production-secret
          POSTGRES_DB: pinda_actions_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U pinda_test -d pinda_actions_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      KEYCLOAK_TEST_DATABASE_URL: postgresql://pinda_test:ci-only-not-a-production-secret@127.0.0.1:5432/pinda_actions_test
      AUTH_TEST_DATABASE_URL: postgresql://pinda_test:ci-only-not-a-production-secret@127.0.0.1:5432/pinda_actions_test
      PLAYWRIGHT_BROWSER_CHANNEL: chromium
    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Preparar Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Instalar dependências
        run: bun install --frozen-lockfile
      - name: Verificar formatação e lint
        run: |
          bun run format:check
          bun run lint
      - name: Testes unitários e de integração
        run: bun test --timeout 30000
      - name: Testar script de deploy
        run: bash tests/deploy-production.sh
      - name: Verificar build e tipagem
        run: |
          bun run build
          bun run typecheck
      - name: Preparar navegador
        run: bunx playwright install --with-deps chromium
      - name: Testes de navegador
        run: bun run test:e2e
