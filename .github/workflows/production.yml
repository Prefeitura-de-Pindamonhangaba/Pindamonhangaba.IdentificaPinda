name: Produção

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: identifica-pinda-production
  cancel-in-progress: false

jobs:
  tests:
    name: Testes
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  images:
    name: Build e publicação
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      app: ${{ steps.image.outputs.name }}@${{ steps.app.outputs.digest }}
      tools: ${{ steps.image.outputs.name }}@${{ steps.tools.outputs.digest }}
    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Definir imagem
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Entrar no GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publicar aplicação
        id: app
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runner
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=app-linux/amd64
          cache-to: type=gha,mode=max,scope=app-linux/amd64
      - name: Publicar ferramentas
        id: tools
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: tooling
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}:tools-sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=app-linux/amd64

  deploy:
    name: Deploy
    needs: images
    runs-on:
      group: identifica-pinda-production
      labels: [self-hosted, Linux, X64, identifica-pinda-production]
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL || 'https://identifica.pindamonhangaba.sp.gov.br' }}
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_DIR: ${{ vars.PRODUCTION_DEPLOY_DIR || '/opt/Pindamonhangaba.IdentificaPinda' }}
      DEPLOY_PROJECT: ${{ vars.PRODUCTION_COMPOSE_PROJECT || 'identifica-pinda-production' }}
      DEPLOY_PLATFORM: linux/amd64
    steps:
      - name: Conferir pasta privada
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOY_DIR" == /* && -d "$DEPLOY_DIR" ]] || { echo 'Provisione a pasta de produção com o .env privado.' >&2; exit 1; }
          target="$(realpath "$DEPLOY_DIR")"
          workspace="$(realpath -m "$GITHUB_WORKSPACE")"
          if [[ "$target" == / || "$target/" == "$workspace/"* || "$workspace/" == "$target/"* ]]; then
            echo 'A pasta privada deve ficar fora do workspace do runner e de seus diretórios ancestrais.' >&2
            exit 1
          fi
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Entrar no GHCR
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/identifica-pinda-docker-${{ github.run_id }}-${{ github.run_attempt }}
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Atualizar aplicação e aguardar saúde
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/identifica-pinda-docker-${{ github.run_id }}-${{ github.run_attempt }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          APP_IMAGE: ${{ needs.images.outputs.app }}
          TOOLS_IMAGE: ${{ needs.images.outputs.tools }}
        run: bash scripts/deploy-production.sh
